<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deriv Lane Scanner Pro FIXED</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,system-ui,sans-serif}
body{background:#070b14;color:#e2e8f0;padding:12px}
.header{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;margin-bottom:12px}
.logo{font-weight:900;font-size:18px}.logo span{color:#22d3ee}
.card{background:#111a2e;border:1px solid #1e2d50;border-radius:14px;padding:12px;margin-bottom:10px}
.grid{display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:1000px){.grid{grid-template-columns:1.2fr 0.8fr}}
.select,.btn{background:#0f1a33;border:1px solid #234078;color:#e2e8f0;border-radius:8px;padding:8px 12px;font-size:13px;cursor:pointer}
.big-digit{font-size:68px;font-weight:900;text-align:center;min-height:80px}
.price{font-size:12px;color:#94a3b8;text-align:center}
.dots{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px;min-height:30px}
.dot{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.dot.over{background:#0e3a2e;color:#34d399;border:1px solid #14532d}
.dot.under{background:#2a1a0e;color:#fbbf24;border:1px solid #78350f}
.stat{font-size:22px;font-weight:800}
.label{font-size:10px;color:#94a3b8;text-transform:uppercase;letter-spacing:1px}
.badge{padding:3px 7px;border-radius:6px;font-size:10px;font-weight:700}
.badge.buy{background:#16a34a;color:white}.badge.sell{background:#dc2626;color:white}.badge.wait{background:#334155;color:#cbd5e1}
.bar-row{display:flex;align-items:center;gap:6px;margin:3px 0;font-size:11px}
.bar{height:6px;background:#1e293b;border-radius:4px;flex:1;overflow:hidden}.fill{height:100%;background:#22d3ee}
.digit-btn{width:34px;height:34px;border-radius:8px;border:1px solid #234078;background:#0f1a33;color:white;cursor:pointer}
.digit-btn.active{background:#22d3ee;color:#020617;font-weight:800}
table{width:100%;border-collapse:collapse;font-size:12px}
th{color:#64748b;text-align:left;padding:6px 4px;font-size:10px;text-transform:uppercase}
td{padding:7px 4px;border-top:1px solid #1e293b}
.strength{height:6px;background:#1e293b;border-radius:3px;overflow:hidden;width:70px;display:inline-block}
.strength-fill{height:100%}
.s-weak{background:#eab308}.s-medium{background:#f97316}.s-strong{background:#22c55e}.s-super{background:#22d3ee}
</style>
</head>
